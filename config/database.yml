default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>

development:
  <<: *default
  database: school_services_development

test:
  <<: *default
  database: school_services_test

production:
  primary: &primary_production
    <<: *default
    database: school_services_production
    username: app
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: school_services_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: school_services_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: school_services_production_cable
    migrations_paths: db/cable_migrate
